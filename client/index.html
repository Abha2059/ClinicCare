<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12856f" />
    <meta
      name="description"
      content="ClinicCare — Better Care. Better Health. Find trusted doctors, browse specialties and book clinic appointments online."
    />
    <title>ClinicCare — Better Care. Better Health.</title>
    <script>
      // Applied before first paint so a returning dark-mode user never sees a
      // white flash. First-time visitors always start in light mode; dark is
      // only applied when they have chosen it via the toggle.
      // Kept in sync with client/src/context/ThemeContext.jsx.
      (function () {
        try {
          if (localStorage.getItem('cliniccare_theme') === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          /* storage blocked — light default applies */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
