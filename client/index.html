<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12856f" />
    <meta
      name="description"
      content="ClinicCare — Better Care. Better Health. Find trusted doctors, browse specialties and book clinic appointments online."
    />
    <title>ClinicCare — Better Care. Better Health.</title>
    <script>
      // Applied before first paint so a dark-mode visitor never sees a white
      // flash. Kept in sync with client/src/context/ThemeContext.jsx.
      (function () {
        try {
          var stored = localStorage.getItem('cliniccare_theme')
          var isDark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (isDark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* storage blocked — fall back to the light default */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
